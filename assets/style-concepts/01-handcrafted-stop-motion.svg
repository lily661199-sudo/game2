 <linearGradient id="beam" x2=".9" y2="1"><stop stop-color="#ffe89c" stop-opacity=".4"/><stop offset="1" stop-color="#ffe89c" stop-opacity="0"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
