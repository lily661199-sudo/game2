 <radialGradient id="spot"><stop stop-color="#fff2be" stop-opacity=".96"/><stop offset=".35" stop-color="#f3c768" stop-opacity=".28"/><stop offset="1" stop-color="#f3c768" stop-opacity="0"/></radialGradient>
 <linearGradient id="wood" x2="1" y2=".2"><stop stop-color="#39261e"/><stop offset=".45" stop-color="#714832"/><stop offset="1" stop-color="#281d19"/></linearGradient>
