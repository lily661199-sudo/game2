known_limitations:
  - The browser now loads one animated Blender room GLB shared across both interactions; dedicated market and lighthouse set dressing is still to be refined.
  - Blender MCP listeners have not been confirmed active. The production Blender scene was generated with Blender 5.3 background mode instead.
  - No classroom or player evidence has been collected; all future concept ratings must remain AI pre-scores until tested.
  - Built-in ImageGen tool is not exposed in this session; ImageGen API returned HTTP 429 because the API organization has no credits. The three current visual options are assistant-authored SVG concept illustrations, not ImageGen outputs.
  - The original comparison board remains a style study with less set detail than the supplied screenshot. The selected direction has a production .blend, animated character root, GLB, and web runtime, but the 3D scene remains an initial production pass and needs iterative art review.
  - The current Codex process must restart to load the newly added Blender MCP server.
