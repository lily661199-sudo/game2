confirmed:
  - Target audience is elementary school students.
  - Learning unit covers everyday financial literacy and investment.
  - The game has two levels, each with one interactive exercise.
  - A correct solution is required to receive that level's key.
  - Each level shows its score and the ending shows learning progress.
  - Delivery is a browser game intended for GitHub Pages or Netlify.
  - User selected a Little Nightmares-inspired mood reference, without copying protected characters or assets.
  - Educational reward profile selected: L/E/M/A weights 0.50/0.15/0.10/0.25.
  - Guessing and overload penalties selected: G=0.15, C=0.10; no hard gates.
  - User requested Blender addon/MCP setup before modeling.
  - User approved the Empathize phase on 2026-11-24.
  - User approved the Define phase and proposed L/E/M/A/G/C evidence plan on 2026-11-24.
  - User approved installation of both local Blender integrations.
  - User selected a combined A+B+D gameplay concept on 2026-11-25.
  - User requested three ImageGen style images and that all later scenes, characters, 3D work, and animation follow the chosen style.
  - User approved ImageGen CLI setup on 2026-11-25.
  - User declined adding paid API credits and asked for GPT-made no-API style options on 2026-11-25.
  - User selected style direction 2, layered paper storybook, on 2026-11-25.
assumptions:
  - Initial use is a short classroom or home learning activity; setting is not yet confirmed.
  - Runtime contains no generative AI or financial transaction features.
  - Learning evidence will initially use anonymous in-game choices and optional teacher observation.
open_questions:
  - Confirm whether the primary use setting is classroom, home, or both.
  - Confirm the target grade/reading range and whether explain-back prompts fit the two-interaction constraint.
  - Set numeric prototype targets after age range and use setting are agreed.
  - Confirm whether Blender MCP listeners are active; direct background Blender is available for asset generation.
